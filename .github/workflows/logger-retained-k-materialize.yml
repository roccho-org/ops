name: logger-retained-k-materialize

on:
  push:
    branches:
      - codex/logger-artifact-assembly-candidate-finding-20261019
    paths:
      - '.github/workflows/logger-retained-k-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: read

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download exact original artifact and independent review body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root='packages/shiftleft-admission/tests/fixtures/logger-language-neutral-establishment'
          mkdir -p "$root"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/roccho-org/ops/actions/artifacts/12240652155/zip' \
            --output "$root/technical-closure.zip"
          gh api 'repos/roccho-org/ops/issues/comments/6283358664' --jq '.body' > "$root/r-v32-comment.md"
          test "$(wc -c < "$root/technical-closure.zip")" = 98368
          test "$(sha256sum "$root/technical-closure.zip" | cut -d' ' -f1)" = 5ac5df9deb5bf6c9a36de31e6d534b23673f0d5016ae7d576b2cd716741000a7
          unzip -t "$root/technical-closure.zip" >/dev/null
          grep -F '### R v32 · head `3372357`' "$root/r-v32-comment.md" >/dev/null
          grep -F '有限corrected-scopeの技術完成' "$root/r-v32-comment.md" >/dev/null

      - name: Generate retained K manifest from exact originals
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('packages/shiftleft-admission/tests/fixtures/logger-language-neutral-establishment')
          archive=root/'technical-closure.zip'
          review=root/'r-v32-comment.md'
          def sha_bytes(raw): return 'sha256:'+hashlib.sha256(raw).hexdigest()
          def sha_file(path): return sha_bytes(path.read_bytes())
          def git_blob(path):
              raw=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          with zipfile.ZipFile(archive) as z:
              names=set(z.namelist())
              required={'SHA256SUMS','finding.json','closure.json','metadata.json','browser.json','interoperability.json'}
              assert required <= names
              sums={}
              for line in z.read('SHA256SUMS').decode().splitlines():
                  digest,path=line.split('  ',1); sums[path]='sha256:'+digest
              for path,digest in sums.items(): assert sha_bytes(z.read(path))==digest
              closure=json.loads(z.read('closure.json'))
              finding=json.loads(z.read('finding.json'))
              browser=json.loads(z.read('browser.json'))
              interchange=json.loads(z.read('interoperability.json'))
              entries={path:sha_bytes(z.read(path)) for path in sorted(required)}
          runtime=finding['supportMatrix']['runtimeProfiles']
          profiles={name:{'baseline':row['baselineState'],'target':row['targetState'],'owner':row['owner'],'primaryPort':row['primaryPort'],'diagnosticPort':row['diagnosticPort']} for name,row in runtime.items()}
          old_unmet=[name for name,row in finding['obligations'].items() if row['status']=='unmet']
          manifest={
            'schema':'ops.logger-language-neutral.retained-k/3','authority':False,
            'purpose':'Retain the exact technical closure archive, fixed old/new Finding, five-profile matrix, causality, exact source context, and the independent R v32 wording after workflow artifact URLs expire.',
            'canonicalMeaning':{'repository':'roccho-dev/adrs','revision':'6e4abcd22dbee397105625b6041ce1a0d4720182','tree':'cf28509d770022d2be6e4d172b0ce8b9486cced1','path':'decisions/logger-language-neutral-contract-admission-261020.jsonl','gitBlob':'9371fed680451f58976a00fda0a71e4fbb54f68f','rawId':'raw.adrs.logger_language_neutral_contract_admission.261020.02','meaningSha256':'sha256:ab3c271e57ba33a7e663f99d417680f6044cc59c099e5223978e2e4ef6811e3c','obligationId':'ops.logger-language-neutral-design.v1'},
            'originalArtifact':{'path':'technical-closure.zip','workflowRunId':39368809399,'artifactId':12240652155,'bytes':archive.stat().st_size,'sha256':sha_file(archive),'gitBlob':git_blob(archive),'entries':entries},
            'oldFinding':{'observationId':finding['observationId'],'coverage':finding['coverage'],'unmet':old_unmet,'treeSet':finding['baseline']['correctedScopeT0']},
            'profileMatrix':{'frozenBeforeFinding':True,**profiles},
            'repairedClosure':{
              'status':closure['status'],'coverage':closure['coverage'],'obligations':list(closure['obligations']),
              'observation':{'repository':'roccho-org/ops',**closure['repaired']['observation']},
              'provider':{'repository':'roccho-org/ops','revision':closure['repaired']['provider']['revision'],'tree':closure['repaired']['provider']['tree'],'contractBlob':closure['repaired']['provider']['files']['contract']['blob'],'coreBlob':closure['repaired']['provider']['files']['js']['blob'],'browserAdapterBlob':closure['repaired']['provider']['files']['browser']['blob']},
              'consumer':{'repository':'roccho-dev/apps','revision':closure['repaired']['consumer']['revision'],'tree':closure['repaired']['consumer']['tree'],'package':closure['repaired']['consumer']['package'],'decisionBlob':closure['repaired']['consumer']['files']['decision']['blob'],'hostBlob':closure['repaired']['consumer']['files']['host']['blob']},
            },
            'causality':closure['decisions'],
            'execution':{
              'crossLanguage':{'javascript':'independent','python':'independent','pythonDelegatesToNode':interchange['implementation']['pythonDelegatesToNode'],'javascriptToPython':interchange['interchange']['javascriptToPython'],'pythonToJavascript':interchange['interchange']['pythonToJavascript'],'rows':interchange['interchange']['rows'],'accepted':interchange['counts']['accepted'],'rejected':interchange['counts']['rejected']},
              'browser':{'status':browser['status'],'providerRevision':browser['providerRevision'],'actualFailureState':True,'typedAction':browser['action'],'controls':browser['controls']},
              'wholeCi':{'ops':'https://github.com/roccho-org/ops/actions/runs/39368809398','apps':'https://github.com/roccho-dev/apps/actions/runs/39365786783'}
            },
            'independentJudgment':{'originalBodyPath':'r-v32-comment.md','originalBodyBytes':review.stat().st_size,'originalBodySha256':sha_file(review),'originalBodyGitBlob':git_blob(review),'structuredCapturePath':'r-v32-capture.json','sourceCommentId':6283358664,'sourceUrl':'https://github.com/roccho-org/ops/pull/602#issuecomment-6283358664','createdAt':'2026-10-20T04:25:39Z','reviewRole':'R'},
            'retentionBoundary':'This K retains the exact technical archive and the independent review wording. It does not itself admit meaning, establish Required, publish a Release, deploy, or claim operational adoption.'
          }
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          assert manifest['originalArtifact']['sha256']=='sha256:5ac5df9deb5bf6c9a36de31e6d534b23673f0d5016ae7d576b2cd716741000a7'
          assert manifest['oldFinding']['coverage']=={'applicable':13,'evaluated':13,'met':8,'unmet':5,'unknown':0,'conflict':0,'stale':0}
          assert set(manifest['oldFinding']['unmet'])=={'cross_language_interoperability','environment_transport','supply_consumption_binding','bounded_safe_failure','causal_design_closure'}
          assert manifest['repairedClosure']['coverage']=={'applicable':13,'evaluated':13,'met':13,'unmet':0,'unknown':0,'conflict':0,'stale':0,'residual':0}
          assert manifest['repairedClosure']['status']=='CONFORMANT'
          assert set(manifest['repairedClosure']['obligations'])=={'purpose_scope_coverage','shared_meaning','cross_language_interoperability','pure_application_boundary','environment_transport','host_context_ownership','supply_consumption_binding','actual_data_use','traceable_evidence','bounded_safe_failure','compatibility','causal_design_closure','small_extensible_design'}
          PY

      - name: Commit exact retained originals
        run: |
          set -euo pipefail
          root='packages/shiftleft-admission/tests/fixtures/logger-language-neutral-establishment'
          git add "$root/technical-closure.zip" "$root/r-v32-comment.md" "$root/manifest.json"
          if git diff --cached --quiet; then
            echo 'retained K already exact'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(logger): retain exact closure originals'
          git push origin "HEAD:${GITHUB_REF_NAME}"
