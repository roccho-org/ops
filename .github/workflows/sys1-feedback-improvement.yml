name: Jev target improvement with evaluator feedback
on:
  push:
    branches: [codex/jev-feedback-improvement-20261020]
    paths:
      - experiments/sys1-eval-loop/feedback-development-live.json
      - experiments/sys1-eval-loop/feedback-confirmation-live.json
permissions:
  actions: read
  contents: read
concurrency:
  group: sys1-feedback-improvement
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.repository == 'roccho-org/ops' && github.actor == 'roccho-dev' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify keyless source, old evidence and negative controls
        run: node --test experiments/sys1-eval-loop/*test.mjs experiments/sys1-continuation/*test.mjs experiments/sys1-continuation/models/*test.mjs
      - name: Verify finite native phase and prepare inputs before credentials
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node experiments/sys1-eval-loop/feedback-improvement.mjs prepare "$RUNNER_TEMP/feedback-improvement"
      - name: Execute bounded target and evaluator phase once
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: node experiments/sys1-eval-loop/feedback-improvement.mjs evaluate "$RUNNER_TEMP/feedback-improvement"
      - name: Score without credentials, including partial execution
        if: always() && steps.prepare.outcome == 'success'
        run: node experiments/sys1-eval-loop/feedback-improvement.mjs score "$RUNNER_TEMP/feedback-improvement"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sys1-feedback-${{ github.run_id }}
          path: ${{ runner.temp }}/feedback-improvement
          if-no-files-found: ignore
          retention-days: 30
