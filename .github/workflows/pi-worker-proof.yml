name: Pi Worker proof (mock inference, OAuth screen)

on:
  push:
    branches: [poc/pi-worker-oauth-20261017, codex/pi-jev-worker-20261020, proposals]
    paths:
      - experiments/pi-worker-proof/**
      - .github/workflows/pi-worker-proof.yml
      - packages/jev/src/**
      - ci.intent.v1.jsonl

permissions:
  contents: read

concurrency:
  group: pi-worker-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          path: ops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: earendil-works/pi-durable-cloudflare
          ref: dcb56ce2d174babb3f00112ac5b8cd597e58ab45
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: upstream/package.json
          run_install: false
      - name: Install upstream locked dependencies
        id: install
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pi-worker-proof"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pnpm-workspace.yaml')
          text = path.read_text()
          assert text.count('allowBuilds:\n') == 1
          path.write_text(text.replace('allowBuilds:\n', 'allowBuilds:\n  "@google/genai@2.21.0": false\n  protobufjs@7.6.6: false\n', 1))
          PY
          git diff -- pnpm-workspace.yaml > "$RUNNER_TEMP/pi-worker-proof/install-policy.patch"
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/pi-worker-proof/install.log"
          git diff --exit-code -- package.json pnpm-lock.yaml
      - name: Check and dry-run the unchanged upstream Worker
        id: baseline
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          pnpm check 2>&1 | tee "$RUNNER_TEMP/pi-worker-proof/baseline-build.log"
      - name: Verify the separately locked owner OAuth composition (no login)
        working-directory: ops/experiments/pi-worker-proof/operator
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          node build.mjs "$GITHUB_WORKSPACE/upstream"
          node --test auth.test.mjs 2>&1 | tee "$RUNNER_TEMP/pi-worker-proof/auth-validation.log"
          cp package.json pnpm-lock.yaml dist/oauth.original.js dist/oauth.verified.js "$RUNNER_TEMP/pi-worker-proof/"
          git diff --exit-code -- package.json pnpm-lock.yaml
      - name: Apply the bounded runtime integration
        id: overlay
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 ../ops/experiments/pi-worker-proof/apply.py
          git add -N src/worker-oauth.ts src/worker-screen.ts src/worker-jev.ts src/jev-client/ src/oauth-module.d.ts worker-oauth.alias.ts vitest.proof.config.ts test/worker-proof.setup.ts test/worker-auth.test.ts test/worker-app.test.ts test/worker-screen.test.ts
          git diff > "$RUNNER_TEMP/pi-worker-proof/app-overlay.patch"
          git diff --exit-code -- package.json pnpm-lock.yaml
      - name: Type-check, build and dry-run the integrated Worker (not test aliases only)
        id: build
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          { pnpm exec tsc && pnpm exec tsc -p tsconfig.client.json && pnpm build && pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run; } 2>&1 | tee "$RUNNER_TEMP/pi-worker-proof/app-build.log"
      - name: Package the separate keyless owner runtime (no deployment)
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 ../ops/experiments/pi-worker-proof/package-runtime.py "$RUNNER_TEMP/pi-jev-runtime"
          pnpm exec wrangler deploy --config "$RUNNER_TEMP/pi-jev-runtime/wrangler.json" --dry-run --outdir "$RUNNER_TEMP/runtime-dry-run"
      - uses: actions/upload-artifact@v4
        with:
          name: pi-jev-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/pi-jev-runtime/
      - name: Workerd app and regression tests with remote network denied
        id: runtime
        if: ${{ !cancelled() && steps.overlay.outcome == 'success' }}
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run --config vitest.proof.config.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/pi-worker-proof/tests.json" 2>&1 | tee "$RUNNER_TEMP/pi-worker-proof/runtime.log"
      - name: Package and exercise the actual screen-only Worker over HTTP
        id: screen
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          screen="$RUNNER_TEMP/pi-worker-screen"
          proof="$RUNNER_TEMP/pi-worker-proof"
          python3 ../ops/experiments/pi-worker-proof/package-screen.py "$screen"
          pnpm exec wrangler deploy --config "$screen/wrangler.json" --dry-run --outdir "$RUNNER_TEMP/screen-dry-run" 2>&1 | tee "$proof/screen-build.log"
          pnpm exec wrangler dev --config "$screen/wrangler.json" --ip 127.0.0.1 --port 8799 --var PI_OAUTH_HOST_ID:00000000-0000-4000-8000-000000000563 > "$proof/screen-worker.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          python3 ../ops/experiments/pi-worker-proof/screen-http.py http://127.0.0.1:8799 "$proof/screen-http.json"
          python3 -m pip install --disable-pip-version-check playwright==1.63.0 > "$RUNNER_TEMP/screen-browser-install.log" 2>&1
          python3 -m playwright install --with-deps chromium >> "$RUNNER_TEMP/screen-browser-install.log" 2>&1
          python3 ../ops/experiments/pi-worker-proof/screen-browser.py http://127.0.0.1:8799 "$proof"
          # No credentials, personal browser state, OAuth query or installation logs are packaged.
          cp ../ops/experiments/pi-worker-proof/SCREEN.md "$screen/SCREEN.md"
      - name: Preserve screen-only deployment bytes (no deployment)
        if: ${{ !cancelled() && steps.screen.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: pi-worker-screen-${{ github.sha }}
          path: ${{ runner.temp }}/pi-worker-screen/
          if-no-files-found: error
          retention-days: 14
      - name: Record scope, exact execution identity and evidence hashes
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          OVERLAY_OUTCOME: ${{ steps.overlay.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          SCREEN_OUTCOME: ${{ steps.screen.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/pi-worker-proof"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def head(path):
              try:
                  return subprocess.check_output(['git','-C',path,'rev-parse','HEAD'], text=True).strip()
              except (OSError, subprocess.CalledProcessError):
                  return None
          root = pathlib.Path(os.environ['RUNNER_TEMP'], 'pi-worker-proof')
          screen = root / 'screen-browser.json'
          receipt = {
              'schema': 'pi-worker-proof.v3',
              'scope': 'MOCK_INFERENCE_AND_REAL_PI_OAUTH_SCREEN_ENTRY',
              'ops_sha': head('ops'),
              'upstream_sha': head('upstream'),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'install': os.environ['INSTALL_OUTCOME'],
              'install_policy_overlay': {'denied_builds': ['@google/genai@2.21.0', 'protobufjs@7.6.6']},
              'upstream_build_dry_run': os.environ['BASELINE_OUTCOME'],
              'app_overlay': os.environ['OVERLAY_OUTCOME'],
              'integrated_app_build_dry_run': os.environ['BUILD_OUTCOME'],
              'workerd_tests': os.environ['RUNTIME_OUTCOME'],
              'screen_package_and_http': os.environ['SCREEN_OUTCOME'],
              'external_auth_screen': json.loads(screen.read_text())['screen'] if screen.exists() else 'NOT_RUN',
              'credentials': 'SYNTHETIC_ONLY_IN_REGRESSION_TESTS_NONE_IN_SCREEN',
              'remote_inference_responses': 'MOCK_ONLY',
              'real_credentials_used': False,
              'live_subscription_inference': 'NOT_RUN',
              'live_oauth_refresh': 'NOT_RUN',
              'cloudflare_deploy': 'NOT_RUN_ROOT_OWNED',
              'production_auth_persistence': 'NOT_AUTHORIZED_OR_PROVEN',
              'merge_authorized': False,
          }
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2)+'\n')
          (root / 'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(root.iterdir()) if p.is_file() and p.name != 'SHA256SUMS'))
          PY
      - name: Preserve proof evidence (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-worker-mock-proof-${{ github.sha }}
          path: ${{ runner.temp }}/pi-worker-proof/
          if-no-files-found: error
          retention-days: 14
