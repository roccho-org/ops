name: Portable task runtime Carrier

on:
  pull_request:
    paths:
      - "packages/ops-task-runtime/**"
      - "packages/gosh/**"
      - "packages/ops-portable-runtime-pack/**"
      - "packages/chatgpt-capability/ingress/carrier-job.mjs"
      - "verification/raw-artifact-carry/**"
      - ".github/workflows/ops-task-runtime-release.yml"
  push:
    branches: [proposals]
    paths:
      - "packages/ops-task-runtime/**"
      - "packages/gosh/**"
      - "packages/ops-portable-runtime-pack/**"
      - "packages/chatgpt-capability/ingress/carrier-job.mjs"
      - "verification/raw-artifact-carry/**"
  workflow_dispatch:
    inputs:
      candidate_payload_url:
        description: 'Explicit opt-in immutable candidate proof payload URL'
        type: string
        required: false
      candidate_payload_sha256:
        description: 'Exact retained candidate payload SHA-256'
        type: string
        required: false
      candidate_runtime_closure_sha256:
        description: 'Exact independently selected native runtime closure identity'
        type: string
        required: false
      candidate_source_commit:
        description: 'Exact candidate source commit; must match checkout and accepted inputs'
        type: string
        required: false

permissions:
  contents: read

jobs:
  build-and-verify:
    if: github.event_name != 'workflow_dispatch' || inputs.candidate_payload_url == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/gosh/go.mod

      - name: Prove raw Carry above legacy 128 MiB bound
        shell: bash
        run: node packages/chatgpt-capability/ingress/carrier-job.mjs selftest-raw-large

      - name: Prove real Qwen model raw Carry
        shell: bash
        run: |
          set -euo pipefail
          manifest="verification/raw-artifact-carry/qwen3.5-0.8b-q4_0.json"
          request="$RUNNER_TEMP/qwen3.5-0.8b-q4_0.request.json"
          out="$RUNNER_TEMP/qwen3.5-0.8b-q4_0"
          receipt="$RUNNER_TEMP/qwen3.5-0.8b-q4_0.verify.json"

          python3 - "$manifest" "$request" <<'PY'
          import json,pathlib,sys
          manifest_path,out_path=map(pathlib.Path,sys.argv[1:])
          x=json.loads(manifest_path.read_text(encoding="utf-8"))
          assert x["schema"]=="ops.rawArtifactCarryProof/1"
          assert x["kind"]=="model"
          assert x["revision"]=="8fea620810c4afa23dd6443f999a48574c1611a3"
          assert x["license"]=="Apache-2.0"
          request={
              "schema":"carrier-job/2",
              "request_id":x["id"],
              "sources":[{
                  "name":x["filename"],
                  "url":x["url"],
                  "bytes":x["bytes"],
                  "sha256":x["sha256"],
              }],
              "payload":{"source":x["filename"],"codec":"raw"},
          }
          out_path.write_text(json.dumps(request,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          PY

          node packages/chatgpt-capability/ingress/carrier-job.mjs materialize             --request "$request" --out "$out"
          node packages/chatgpt-capability/ingress/carrier-job.mjs verify             --input "$out" --receipt "$receipt"

          python3 - "$manifest" "$receipt" "$out" <<'PY'
          import hashlib,json,pathlib,sys
          manifest_path,receipt_path,root=map(pathlib.Path,sys.argv[1:])
          expected=json.loads(manifest_path.read_text(encoding="utf-8"))
          observed=json.loads(receipt_path.read_text(encoding="utf-8"))
          assert observed["schema"]=="carrier-job-receipt/2"
          assert observed["status"]=="PASS"
          assert observed["payload"]["source"]==expected["filename"]
          assert observed["payload"]["bytes"]==expected["bytes"]
          assert observed["payload"]["sha256"]==expected["sha256"]
          payload=root/"files"/expected["filename"]
          assert payload.stat().st_size==expected["bytes"]
          h=hashlib.sha256()
          with payload.open("rb") as f:
              for chunk in iter(lambda:f.read(8*1024*1024),b""):
                  h.update(chunk)
          assert h.hexdigest()==expected["sha256"]
          print(json.dumps({
              "schema":"ops.rawArtifactCarryModelProof/1",
              "status":"PASS",
              "id":expected["id"],
              "bytes":expected["bytes"],
              "sha256":expected["sha256"],
          },sort_keys=True))
          PY

      - name: Prove real Laya model raw Carry
        shell: bash
        run: |
          set -euo pipefail
          manifest="verification/raw-artifact-carry/laya-multilingual.json"
          request="$RUNNER_TEMP/laya-multilingual.request.json"
          out="$RUNNER_TEMP/laya-multilingual"
          receipt="$RUNNER_TEMP/laya-multilingual.verify.json"

          python3 - "$manifest" "$request" <<'PY'
          import json,pathlib,sys
          manifest_path,out_path=map(pathlib.Path,sys.argv[1:])
          x=json.loads(manifest_path.read_text(encoding="utf-8"))
          assert x["schema"]=="ops.rawArtifactCarryProof/1"
          assert x["kind"]=="model"
          assert x["license"]=="Apache-2.0"
          request={
              "schema":"carrier-job/2",
              "request_id":x["id"],
              "sources":[{
                  "name":x["filename"],
                  "url":x["url"],
                  "bytes":x["bytes"],
                  "sha256":x["sha256"],
              }],
              "payload":{"source":x["filename"],"codec":"raw"},
          }
          out_path.write_text(json.dumps(request,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          PY

          node packages/chatgpt-capability/ingress/carrier-job.mjs materialize             --request "$request" --out "$out"
          node packages/chatgpt-capability/ingress/carrier-job.mjs verify             --input "$out" --receipt "$receipt"

          python3 - "$manifest" "$receipt" "$out" <<'PY'
          import hashlib,json,pathlib,sys
          manifest_path,receipt_path,root=map(pathlib.Path,sys.argv[1:])
          expected=json.loads(manifest_path.read_text(encoding="utf-8"))
          observed=json.loads(receipt_path.read_text(encoding="utf-8"))
          assert observed["schema"]=="carrier-job-receipt/2"
          assert observed["status"]=="PASS"
          assert observed["payload"]["source"]==expected["filename"]
          assert observed["payload"]["bytes"]==expected["bytes"]
          assert observed["payload"]["sha256"]==expected["sha256"]
          payload=root/"files"/expected["filename"]
          assert payload.stat().st_size==expected["bytes"]
          h=hashlib.sha256()
          with payload.open("rb") as f:
              for chunk in iter(lambda:f.read(8*1024*1024),b""):
                  h.update(chunk)
          assert h.hexdigest()==expected["sha256"]
          print(json.dumps({
              "schema":"ops.rawArtifactCarryModelProof/1",
              "status":"PASS",
              "id":expected["id"],
              "bytes":expected["bytes"],
              "sha256":expected["sha256"],
          },sort_keys=True))
          PY

      - name: Build, Carry, materialize, and replay
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_TASK_RUNTIME_OUT: ${{ runner.temp }}/ops-task-runtime
        shell: bash
        run: packages/ops-task-runtime/ci.sh

      - name: Upload exact assets
        uses: actions/upload-artifact@v4
        with:
          name: ops-task-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/ops-task-runtime/assets/
          if-no-files-found: error
          retention-days: 30

  publish-and-readback:
    if: github.event_name == 'push' && github.ref == 'refs/heads/proposals'
    needs: build-and-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ops-task-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/ops-task-runtime/assets

      - name: Publish immutable Release and verify public readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/ops-task-runtime/assets"
          payload_sha="$(cat "$assets/payload.sha256")"
          tag="ops-task-runtime-linux-amd64-$payload_sha"
          readback="$RUNNER_TEMP/ops-task-runtime-release-readback"
          public="$RUNNER_TEMP/ops-task-runtime-public-readback"
          rm -rf "$readback" "$public"
          mkdir -p "$readback" "$public"

          python3 - "$assets" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          receipt=json.loads((root/'assets.receipt.json').read_text(encoding='utf-8'))
          assert receipt['schema']=='ops.taskRuntimeAssets/1' and receipt['status']=='PASS'
          expected=sorted(p.name for p in root.iterdir() if p.name!='assets.receipt.json')
          observed=sorted(row['name'] for row in receipt['assets'])
          assert expected==observed,(expected,observed)
          for row in receipt['assets']:
              p=root/row['name']
              assert p.stat().st_size==row['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256']
          PY

          created=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            :
          else
            gh release create "$tag" "$assets"/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "$tag" \
              --notes 'roccho-dev/adrs#317'
            created=true
          fi

          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$readback"
          python3 - "$assets" "$readback" <<'PY'
          import pathlib,sys
          expected=pathlib.Path(sys.argv[1]); observed=pathlib.Path(sys.argv[2])
          left=sorted(p.name for p in expected.iterdir())
          right=sorted(p.name for p in observed.iterdir())
          assert left==right,(left,right)
          for name in left:
              assert (expected/name).read_bytes()==(observed/name).read_bytes(),name
          PY

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx true; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi

          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          for file in "$assets"/*; do
            name="$(basename "$file")"
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 1 \
              --silent --show-error "$base/$name" -o "$public/$name"
            cmp "$file" "$public/$name"
          done

          carrier="$(find "$public" -maxdepth 1 -type f -name '*.tar.gz.b64.txt' -printf '%f\n')"
          manifest="$(find "$public" -maxdepth 1 -type f -name '*.manifest.json' -printf '%f\n')"
          source="$(find "$public" -maxdepth 1 -type f -name '*.source.json' -printf '%f\n')"
          receipt="$(find "$public" -maxdepth 1 -type f -name '*.receipt.json' ! -name 'assets.receipt.json' -printf '%f\n')"
          test -n "$carrier"; test -n "$manifest"; test -n "$source"; test -n "$receipt"

          python3 - "$RUNNER_TEMP/ops-task-runtime-public-request.json" "$base" "$public" \
            "$carrier" "$manifest" "$source" "$receipt" "$payload_sha" <<'PY'
          import hashlib,json,pathlib,sys
          out,base,root,*rest=sys.argv[1:]
          *names,payload=rest
          root=pathlib.Path(root)
          value={
              'schema':'carrier-job/1',
              'request_id':'ops-task-runtime-public',
              'sources':[{'name':name,'url':base+'/'+name,'sha256':hashlib.sha256((root/name).read_bytes()).hexdigest()} for name in names],
              'carrier_name':names[0],
              'payload_sha256':payload,
          }
          pathlib.Path(out).write_text(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          PY

          node packages/chatgpt-capability/ingress/carrier-job.mjs materialize \
            --request "$RUNNER_TEMP/ops-task-runtime-public-request.json" \
            --out "$RUNNER_TEMP/ops-task-runtime-public-materialized"
          node packages/chatgpt-capability/ingress/carrier-job.mjs verify \
            --input "$RUNNER_TEMP/ops-task-runtime-public-materialized" \
            --receipt "$RUNNER_TEMP/ops-task-runtime-public-carrier.receipt.json"

          runtime="$RUNNER_TEMP/ops-task-runtime-public-runtime"
          mkdir -p "$runtime"
          tar -xzf "$RUNNER_TEMP/ops-task-runtime-public-materialized/payload.bin" -C "$runtime"
          "$runtime/bin/gosh" version
          "$runtime/bin/task" --version
          "$runtime/bin/actrun" --help >/dev/null

          printf '{"schema":"ops.taskRuntimeRelease/1","status":"PASS","tag":"%s","createdThisRun":%s,"payloadSha256":"%s"}\n' \
            "$tag" "$created" "$payload_sha" > "$RUNNER_TEMP/ops-task-runtime-release.receipt.json"

      - name: Upload Release readback receipt
        uses: actions/upload-artifact@v4
        with:
          name: ops-task-runtime-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ops-task-runtime-release.receipt.json
            ${{ runner.temp }}/ops-task-runtime-public-carrier.receipt.json
          if-no-files-found: error
          retention-days: 30

  candidate-pure-check:
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_payload_url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_source_commit }}
      - name: Verify exact candidate source and retained payload
        env:
          CANDIDATE_PAYLOAD_URL: ${{ inputs.candidate_payload_url }}
          CANDIDATE_PAYLOAD_SHA256: ${{ inputs.candidate_payload_sha256 }}
          CANDIDATE_SOURCE_COMMIT: ${{ inputs.candidate_source_commit }}
          CANDIDATE_RUNTIME_CLOSURE: ${{ inputs.candidate_runtime_closure_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE_COMMIT"
          python3 - <<'PYTHON'
          import os,re,urllib.parse
          u=urllib.parse.urlsplit(os.environ['CANDIDATE_PAYLOAD_URL'])
          assert u.scheme=='https' and u.netloc=='github.com'
          assert u.path.startswith('/roccho-org/ops/releases/download/')
          assert not u.query and not u.fragment
          assert re.fullmatch('[0-9a-f]{64}',os.environ['CANDIDATE_PAYLOAD_SHA256'])
          assert re.fullmatch('[0-9a-f]{40}',os.environ['CANDIDATE_SOURCE_COMMIT'])
          assert re.fullmatch('[0-9a-f]{64}',os.environ['CANDIDATE_RUNTIME_CLOSURE'])
          PYTHON
          curl --fail --location --silent --show-error "$CANDIDATE_PAYLOAD_URL" -o "$RUNNER_TEMP/candidate-payload.tar.gz"
          python3 - <<'PYTHON'
          import hashlib,os,pathlib,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          p=root/'candidate-payload.tar.gz'
          h=hashlib.sha256()
          with p.open('rb') as f:
              for b in iter(lambda:f.read(1048576),b''): h.update(b)
          assert h.hexdigest()==os.environ['CANDIDATE_PAYLOAD_SHA256']
          with tarfile.open(p) as t: t.extractall(root/'candidate-pack',filter='data')
          PYTHON
      - name: Execute exact retained pure checks through fresh native runtime
        env:
          CANDIDATE_SOURCE_COMMIT: ${{ inputs.candidate_source_commit }}
          CANDIDATE_RUNTIME_CLOSURE: ${{ inputs.candidate_runtime_closure_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 packages/ops-task-runtime/candidate/restore-check.py             --pack "$RUNNER_TEMP/candidate-pack"             --target "$RUNNER_TEMP/candidate-target"             --evidence "$RUNNER_TEMP/candidate-evidence"             --expected-commit "$CANDIDATE_SOURCE_COMMIT" --expected-runtime-closure "$CANDIDATE_RUNTIME_CLOSURE" --source-repo "$GITHUB_WORKSPACE"
      - name: Retain actual runner proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-candidate-${{ inputs.candidate_source_commit }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-evidence/
          if-no-files-found: error
          retention-days: 30
