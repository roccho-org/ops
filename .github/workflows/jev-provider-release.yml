name: jev provider release
on:
  pull_request:
    paths:
      - 'packages/jev/**'
      - 'packages/typellm/**'
      - 'tools/jev-provider-artifact.py'
      - 'tools/test_jev_provider_artifact.py'
      - 'flake.nix'
      - 'flake.lock'
      - 'ci.intent.v1.jsonl'
      - '.github/workflows/jev-provider-release.yml'
      - '.github/workflows/nix-check.yml'
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
      raw_relations_trial:
        type: boolean
        default: false
      raw_relations_stage:
        description: Fixed development or confirmation; confirmation requires external R stage1 acceptance and root GO
        type: choice
        options: [development, confirmation]
        default: development
      expected_workflow_sha:
        description: P/R accepted actual workflow commit (not authority by itself)
        type: string
        default: ''
      raw_relations_bundle_sha:
        description: SHA256 of R frozen public manifest.json (no Gold)
        type: string
        default: ''
      stage1_root_go:
        description: Root records independently scored stage1 16/16 PASS and reconciled exact source/artifact; assertion, not machine proof
        type: boolean
        default: false
      stage1_run_id:
        description: Root-reconciled development Actions run ID (confirmation only)
        type: string
        default: ''
      stage1_artifact_sha256:
        description: Root-reconciled development artifact ZIP SHA256 (confirmation only)
        type: string
        default: ''
      stage1_report_sha256:
        description: Independent R stage1 scoring report SHA256, held outside key process (confirmation only)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build-test:
    if: ${{ !inputs.raw_relations_trial }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/proposals' && github.event.repository.default_branch == 'proposals' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Verify exact source and existing release admission
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected_commit=%s\nactual_commit=%s\n' "$EXACT_SHA" "$actual"
          test "$actual" = "$EXACT_SHA"
          nix shell --inputs-from . nixpkgs#yq-go nixpkgs#python3 -c bash -c '
            yq -o=json . .github/workflows/jev-provider-release.yml | python3 packages/hayamimi-web/build/check-release-workflow.py
            python3 packages/hayamimi-web/build/check-release-workflow.py --selftest
            python3 packages/hayamimi-web/build/release-provenance.py selftest'
          python3 tools/test_jev_provider_artifact.py
      - name: Build and execute the completed ESM, with old CLI regression
        run: |
          set -euo pipefail
          before="$(sha256sum flake.lock | cut -d' ' -f1)"
          jev_out="$(nix build --no-link --print-out-paths -L .#jev-worker-esm)"
          typed_out="$(nix build --no-link --print-out-paths -L .#typellm-worker-esm)"
          nix build --no-link -L .#checks.x86_64-linux.jev .#checks.x86_64-linux.typellm
          test "$before" = "$(sha256sum flake.lock | cut -d' ' -f1)"
          git diff --exit-code -- flake.lock
          mkdir -p "$RUNNER_TEMP/jev-provider"
          cp "$jev_out/jev-provider.zip" "$jev_out/jev-provider.zip.sha256" "$RUNNER_TEMP/jev-provider/"
          cp "$typed_out/typellm-provider.zip" "$typed_out/typellm-provider.zip.sha256" "$RUNNER_TEMP/jev-provider/"
          for provider in jev typellm; do
            archive="$RUNNER_TEMP/jev-provider/$provider-provider.zip"
            digest="$(cut -d' ' -f1 "$archive.sha256")"
            python3 tools/jev-provider-artifact.py --provider "$provider" verify --archive "$archive" --sha256 "$digest" --extract "$RUNNER_TEMP/$provider-entry"
          done
          nix shell --inputs-from . nixpkgs#nodejs -c env JEV_PROVIDER_ENTRY="$RUNNER_TEMP/jev-entry/jev.mjs" node --test packages/jev/tests/batch.test.mjs
          nix shell --inputs-from . nixpkgs#nodejs -c env JEV_QUESTIONS_ENTRY="$RUNNER_TEMP/jev-entry/jev.mjs" node --test packages/jev/tests/questions.test.mjs
          nix shell --inputs-from . nixpkgs#nodejs -c env TYPELLM_PROVIDER_ENTRY="$RUNNER_TEMP/typellm-entry/typellm.mjs" node --test packages/typellm/tests/typellm.test.mjs
          nix shell --inputs-from . nixpkgs#nodejs -c env JEV_PROVIDER_ENTRY="$RUNNER_TEMP/jev-entry/jev.mjs" TYPELLM_PROVIDER_ENTRY="$RUNNER_TEMP/typellm-entry/typellm.mjs" node --test packages/jev/tests/distribution.test.mjs
      - name: Bind current canonical check and merged review proof
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/proposals" --jq .commit.sha)" = "$EXACT_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXACT_SHA&event=push&branch=proposals&per_page=100" > "$RUNNER_TEMP/canonical-runs.json"
          python3 - "$RUNNER_TEMP/canonical-runs.json" "$EXACT_SHA" <<'PY'
          import json,sys
          rows=[r for r in json.load(open(sys.argv[1]))['workflow_runs'] if r['path']=='.github/workflows/nix-check.yml' and r['head_sha']==sys.argv[2] and r['event']=='push' and r['head_branch']=='proposals']
          assert rows and rows[0]['status']=='completed' and rows[0]['conclusion']=='success'
          print('canonical_nix_run='+str(rows[0]['id']))
          PY
          gh api "repos/$GITHUB_REPOSITORY/commits/$EXACT_SHA/pulls" > "$RUNNER_TEMP/associated.json"
          pr="$(python3 - "$RUNNER_TEMP/associated.json" "$EXACT_SHA" <<'PY'
          import json,sys
          rows=[p for p in json.load(open(sys.argv[1])) if p.get('merged_at') and p['base']['ref']=='proposals' and p.get('merge_commit_sha')==sys.argv[2]]
          assert len(rows)==1
          print(rows[0]['number'])
          PY
          )"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > "$RUNNER_TEMP/pr.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$pr/reviews?per_page=100" > "$RUNNER_TEMP/review-pages.json"
          python3 - "$RUNNER_TEMP/review-pages.json" "$RUNNER_TEMP/reviews.json" <<'PY'
          import json,sys
          json.dump([r for page in json.load(open(sys.argv[1])) for r in page],open(sys.argv[2],'w'))
          PY
          head="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/pr.json"))["head"]["sha"])')"
          head_tree="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq .commit.tree.sha)"
          merge_tree="$(git rev-parse HEAD^{tree})"
          dir="$RUNNER_TEMP/jev-provider"
          python3 packages/hayamimi-web/build/release-provenance.py proof --pr "$RUNNER_TEMP/pr.json" --reviews "$RUNNER_TEMP/reviews.json" --head-tree "$head_tree" --merge-sha "$EXACT_SHA" --merge-tree "$merge_tree" --out "$dir/merged-pr-proof.json"
          for provider in jev typellm; do
            python3 tools/jev-provider-artifact.py --provider "$provider" provenance --archive "$dir/$provider-provider.zip" --proof "$dir/merged-pr-proof.json" --out "$dir/$provider-provenance.json" --sha "$EXACT_SHA" --tree "$merge_tree" --workflow-ref "$GITHUB_WORKFLOW_REF" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --root "$GITHUB_WORKSPACE"
          done
          for provider in jev typellm; do
            python3 tools/jev-provider-artifact.py --provider "$provider" verify-release --paired --dir "$dir" --sha "$EXACT_SHA"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jev-provider-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/jev-provider/
          if-no-files-found: error
  raw-relations-trial:
    if: github.event_name == 'workflow_dispatch' && inputs.raw_relations_trial && !inputs.publish && github.repository == 'roccho-org/ops' && github.ref == 'refs/heads/codex/raw-annotations-676-20261024' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: ops676-raw-relations-corrective-${{ inputs.raw_relations_stage }}-v2
      cancel-in-progress: false
    env:
      EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
      BUNDLE_SHA: ${{ inputs.raw_relations_bundle_sha }}
      TRIAL_ID: ${{ inputs.raw_relations_stage == 'confirmation' && 'ops676-raw-relations-corrective-confirmation-v2' || 'ops676-raw-relations-corrective-development-v2' }}
      RAW_RELATIONS_STAGE: ${{ inputs.raw_relations_stage }}
      BUNDLE_DIR: ${{ inputs.raw_relations_stage == 'confirmation' && 'live-corrective-fresh' || 'live' }}
      STAGE1_ROOT_GO: ${{ inputs.stage1_root_go }}
      STAGE1_RUN_ID: ${{ inputs.stage1_run_id }}
      STAGE1_ARTIFACT_SHA256: ${{ inputs.stage1_artifact_sha256 }}
      STAGE1_REPORT_SHA256: ${{ inputs.stage1_report_sha256 }}
    steps:
      # P/R independently accept the actual workflow/runner/bundle commit before
      # dispatch. Matching user inputs alone are not an authorization proof.
      # P checks Actions history and retained reservations for this fixed trial
      # before ONE dispatch; concurrency alone cannot prevent duplicate dispatch.
      # Confirmation inputs record P's external reconciliation and R 16/16 PASS;
      # no scorer/Gold is loaded here, and these assertions are not machine proof.
      # Both stages use this same accepted controller commit and product pin.
      - name: Verify fixed manual identity before checkout or secrets
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = roccho-org/ops
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/codex/raw-annotations-676-20261024
          test "$GITHUB_RUN_ATTEMPT" = 1
          case "$RAW_RELATIONS_STAGE" in
            development)
              test "$BUNDLE_SHA" = 9288a688b4eadcc003f1a4f7b0dabe38977826c6fac05a03774a792f43193f02
              test "$STAGE1_ROOT_GO" = false
              test -z "$STAGE1_RUN_ID$STAGE1_ARTIFACT_SHA256$STAGE1_REPORT_SHA256"
              ;;
            confirmation)
              test "$BUNDLE_SHA" = 91c24283190300becdb2d6fee700628caad93b38e27a797b1f0ee63dbcf820b2
              test "$STAGE1_ROOT_GO" = true
              [[ $STAGE1_RUN_ID =~ ^[1-9][0-9]*$ && $STAGE1_ARTIFACT_SHA256 =~ ^[a-f0-9]{64}$ && $STAGE1_REPORT_SHA256 =~ ^[a-f0-9]{64}$ ]]
              test "$STAGE1_RUN_ID" != "$GITHUB_RUN_ID"
              ;;
            *) exit 1 ;;
          esac
          [[ $EXPECTED_WORKFLOW_SHA =~ ^[a-f0-9]{40}$ && $BUNDLE_SHA =~ ^[a-f0-9]{64}$ ]]
          test "$EXPECTED_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$EXPECTED_WORKFLOW_SHA" = "$GITHUB_WORKFLOW_SHA"
          printf 'trial_id=%s run_id=%s workflow_sha=%s product_sha=%s\n' "$TRIAL_ID" "$GITHUB_RUN_ID" "$EXPECTED_WORKFLOW_SHA" bc1f991618a2f17ba0e4dc51f7811af5dddf72ac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bc1f991618a2f17ba0e4dc51f7811af5dddf72ac
          path: trial-product
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Build immutable installed consumer and preflight all sixteen plans without key
        id: trial_prepare
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git -C trial-product rev-parse HEAD)" = bc1f991618a2f17ba0e4dc51f7811af5dddf72ac
          root="$(cd trial-product && nix build --no-write-lock-file --no-link --print-out-paths .#jev-review)"
          mapfile -t exec_lines < <(grep '^exec ' "$root/bin/jev-review")
          test "${#exec_lines[@]}" -eq 1
          pattern='^exec (/nix/store/[a-z0-9]{32}-nodejs-[^/ ]+/bin/node) (/nix/store/[a-z0-9]{32}-jev-review-sources/jev-review)/bin/jev-review[.]mjs "[$]@"$'
          [[ ${exec_lines[0]} =~ $pattern ]]
          node="${BASH_REMATCH[1]}" source="${BASH_REMATCH[2]}"
          diff -r "$source" trial-product/packages/jev-review
          diff -r "${source%/jev-review}/jev" trial-product/packages/jev
          diff -r "${source%/jev-review}/structured-diagnostic" trial-product/packages/structured-diagnostic
          runner="$GITHUB_WORKSPACE/packages/jev-review/tests/raw-relations-trial.mjs"
          git diff --exit-code -- "$runner"
          "$node" "$runner" selftest "$GITHUB_WORKSPACE/trial-product"
          "$node" "$runner" prepare "$GITHUB_WORKSPACE/trial-product" "$root" \
            "$GITHUB_WORKSPACE/packages/jev-review/tests/fixtures/raw-relations/$BUNDLE_DIR" "$BUNDLE_SHA" "$RUNNER_TEMP/raw-relations-evidence"
          { echo "node=$node"; echo "root=$root"; } >> "$GITHUB_OUTPUT"
      - name: Evaluate sixteen frozen plans through installed Jev consumer
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          NODE: ${{ steps.trial_prepare.outputs.node }}
          ROOT: ${{ steps.trial_prepare.outputs.root }}
        run: |
          set -euo pipefail
          "$NODE" "$GITHUB_WORKSPACE/packages/jev-review/tests/raw-relations-trial.mjs" run \
            "$GITHUB_WORKSPACE/trial-product" "$ROOT" \
            "$GITHUB_WORKSPACE/packages/jev-review/tests/fixtures/raw-relations/$BUNDLE_DIR" "$BUNDLE_SHA" "$RUNNER_TEMP/raw-relations-evidence"
      - name: Upload bounded trial evidence including failed or unknown attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: raw-relations-${{ env.TRIAL_ID }}-${{ github.run_id }}
          path: ${{ runner.temp }}/raw-relations-evidence/
          if-no-files-found: warn
          retention-days: 30
  publish:
    needs: build-test
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/proposals' && github.event.repository.default_branch == 'proposals'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jev-provider-${{ github.sha }}
          path: ${{ runner.temp }}/jev-provider
      - name: Revalidate current review, publish fixed set, and byte-compare readback
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/proposals" --jq .commit.sha)" = "$EXACT_SHA"
          dir="$RUNNER_TEMP/jev-provider"
          for provider in jev typellm; do
            python3 tools/jev-provider-artifact.py --provider "$provider" verify-release --paired --dir "$dir" --sha "$EXACT_SHA"
          done
          pr="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/jev-provider/merged-pr-proof.json"))["pr_number"])')"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > "$RUNNER_TEMP/current-pr.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$pr/reviews?per_page=100" > "$RUNNER_TEMP/current-review-pages.json"
          python3 - "$RUNNER_TEMP/current-review-pages.json" "$RUNNER_TEMP/current-reviews.json" <<'PY'
          import json,sys
          json.dump([r for page in json.load(open(sys.argv[1])) for r in page],open(sys.argv[2],'w'))
          PY
          head="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/current-pr.json"))["head"]["sha"])')"
          head_tree="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq .commit.tree.sha)"
          python3 packages/hayamimi-web/build/release-provenance.py proof --pr "$RUNNER_TEMP/current-pr.json" --reviews "$RUNNER_TEMP/current-reviews.json" --head-tree "$head_tree" --merge-sha "$EXACT_SHA" --merge-tree "$(git rev-parse HEAD^{tree})" --out "$RUNNER_TEMP/current-proof.json"
          cmp "$RUNNER_TEMP/current-proof.json" "$dir/merged-pr-proof.json"
          tag="jev-provider-$EXACT_SHA"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "$dir/jev-provider.zip" "$dir/jev-provider.zip.sha256" "$dir/jev-provenance.json" "$dir/typellm-provider.zip" "$dir/typellm-provider.zip.sha256" "$dir/typellm-provenance.json" "$dir/merged-pr-proof.json" --repo "$GITHUB_REPOSITORY" --target "$EXACT_SHA" --latest=false --title "$tag" --notes 'Independent Jev named questions and TypeLLM typed generation; reviewed source, not live-provider evidence.'
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/jev-readback"
          for provider in jev typellm; do
            python3 tools/jev-provider-artifact.py --provider "$provider" verify-release --paired --dir "$RUNNER_TEMP/jev-readback" --sha "$EXACT_SHA"
          done
          for name in jev-provider.zip jev-provider.zip.sha256 jev-provenance.json typellm-provider.zip typellm-provider.zip.sha256 typellm-provenance.json merged-pr-proof.json; do
            cmp "$dir/$name" "$RUNNER_TEMP/jev-readback/$name"
          done
